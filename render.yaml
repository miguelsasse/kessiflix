services:
  - type: web
    name: kessiflix
    env: node
    region: oregon
    plan: free
    # --include=dev garante que typescript/tailwind/tipos (devDependencies)
    # sejam instalados — o build do Next precisa deles.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      # NODE_ENV só vira "production" no runtime (via script "npm start"),
      # nunca durante o install/build, senão as devDependencies somem.
      - key: NODE_VERSION
        value: 20.11.0
