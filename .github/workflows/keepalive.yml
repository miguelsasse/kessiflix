name: Manter KEssiFLIX acordado

# Mantém o app online no plano grátis do Render (que dorme após ~15 min sem acesso).
# O GitHub às vezes atrasa o agendamento, então cada execução fica ~9 minutos
# pingando a cada 50s — assim a cobertura é quase contínua mesmo com atraso.

on:
  schedule:
    - cron: '*/10 * * * *'   # tenta iniciar a cada 10 minutos
  workflow_dispatch:          # permite rodar manualmente também

# Evita acumular execuções sobrepostas
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - name: Pingar o app por ~9 minutos
        run: |
          URL="https://kessiflix.onrender.com/"
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "erro")
            echo "[$(date -u +%H:%M:%S)] ping $i -> HTTP $code"
            if [ "$i" -lt 10 ]; then sleep 50; fi
          done
