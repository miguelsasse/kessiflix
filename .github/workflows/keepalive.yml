name: Manter KEssiFLIX acordado

# Pinga o app de tempos em tempos pra ele não "dormir" no plano grátis do Render
# (o Render dorme após ~15 min sem acesso e mostra a tela de "waking up").

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch:          # permite rodar manualmente também

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar o servidor
        run: |
          echo "Pingando KEssiFLIX..."
          code=$(curl -s -o /dev/null -w "%{http_code}" https://kessiflix.onrender.com/ || echo "erro")
          echo "Resposta: HTTP $code"
